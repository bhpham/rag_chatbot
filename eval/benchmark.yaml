# Everstorm RAG benchmark
#
# Each item is one question with the document it must be answered from and a
# list of acceptable answer keys. An answer key matches if it appears in the
# text after normalization (lowercase, collapsed whitespace, unified dashes).
# Keys are alternatives: matching ANY one counts as a hit.
#
# `abstain: true` marks questions that are NOT answerable from the corpus.
# They are excluded from retrieval recall and used only to measure whether the
# model correctly declines instead of inventing an answer.
#
# Keep keys short and distinctive. Long keys break on PDF line wrapping.

- id: ret-window
  question: "How long do I have to return an item?"
  source: "Everstorm_Return_and_exchange_policy.pdf"
  answer_keys: ["30 days"]

- id: ret-final-sale
  question: "Can I return a final sale item?"
  source: "Everstorm_Return_and_exchange_policy.pdf"
  answer_keys: ["no return unless defective"]

